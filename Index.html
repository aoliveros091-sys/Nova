<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Loader</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05060c;
    color: white;
    font-family: "Space Mono", monospace;
}

/* =========================
   FAKE NOVA BACKGROUND
========================= */

#fakeNova {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 40%, #12162b 0%, #070912 45%, #03040a 100%);
    display: flex;
    opacity: 1;
    transition: opacity .35s ease;
}

.sidebar {
    width: 68px;
    height: 100%;
    border-right: 1px solid rgba(255,255,255,.08);
    background: rgba(5,6,12,.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
}

.logo {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 18px;
    color: #fff;
    background: linear-gradient(135deg,#6d5cff,#a88bff);
    box-shadow: 0 0 25px rgba(109,92,255,.35);
}

.fakeContent {
    flex: 1;
    padding: 55px;
}

.fakeTitle {
    font-size: 34px;
    font-weight: 700;
    margin-bottom: 8px;
}

.fakeSubtitle {
    color: #7f8497;
    font-size: 13px;
}

.fakeCards {
    display: flex;
    gap: 18px;
    margin-top: 45px;
}

.fakeCard {
    width: 220px;
    height: 120px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 16px;
    background: rgba(255,255,255,.025);
}

/* =========================
   LOADING OVERLAY
========================= */

#loading {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5,6,12,.35);
    backdrop-filter: blur(2px);
    transition: opacity .35s ease;
}

.loadingBox {
    text-align: center;
}

.loadingTitle {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 12px;
}

.loadingText {
    color: #85899d;
    font-size: 12px;
}

.dots {
    margin-top: 18px;
    display: flex;
    justify-content: center;
    gap: 6px;
}

.dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #8b7cff;
    animation: pulse 1s infinite ease-in-out;
}

.dot:nth-child(2) {
    animation-delay: .15s;
}

.dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes pulse {
    0%,100% {
        opacity: .25;
        transform: scale(.8);
    }

    50% {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================
   IFRAME
========================= */

#app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    opacity: 0;
    z-index: 200;
    transition: opacity .35s ease;
}

/* =========================
   ERROR SCREEN
========================= */

#error {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, #110b12 0%, #05060c 55%, #020307 100%);
    padding: 30px;
}

.errorBox {
    width: min(760px, 100%);
    border: 1px solid rgba(255, 90, 110, .22);
    border-radius: 14px;
    background: rgba(15, 8, 13, .72);
    box-shadow:
        0 0 60px rgba(255, 50, 80, .06),
        inset 0 0 40px rgba(255,255,255,.015);
    padding: 28px;
}

.errorTop {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-bottom: 22px;
}

.errorIcon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,70,90,.10);
    border: 1px solid rgba(255,70,90,.25);
    color: #ff6878;
    font-size: 20px;
    font-weight: bold;
}

.errorTitle {
    color: #ff6878;
    font-size: 18px;
    font-weight: 700;
}

.errorStatus {
    color: #a8a2ab;
    font-size: 11px;
    margin-top: 4px;
}

.errorMessage {
    border-top: 1px solid rgba(255,255,255,.07);
    padding-top: 20px;
    color: #ff858f;
    font-size: 12px;
    line-height: 1.8;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.errorWarning {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 9px;
    background: rgba(255,180,60,.055);
    border: 1px solid rgba(255,180,60,.13);
    color: #d4b27c;
    font-size: 11px;
    line-height: 1.7;
}

.retry {
    margin-top: 20px;
    padding: 10px 15px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px;
    background: rgba(255,255,255,.04);
    color: #ddd;
    font-family: inherit;
    font-size: 11px;
    cursor: pointer;
}

.retry:hover {
    background: rgba(255,255,255,.08);
}
</style>
</head>

<body>

<!-- Fake Nova page shown while loading -->
<div id="fakeNova">

    <div class="sidebar">
        <div class="logo">N</div>
    </div>

    <div class="fakeContent">
        <div class="fakeTitle">Nova</div>
        <div class="fakeSubtitle">Your games, all in one place.</div>

        <div class="fakeCards">
            <div class="fakeCard"></div>
            <div class="fakeCard"></div>
            <div class="fakeCard"></div>
        </div>
    </div>

</div>


<!-- Loading overlay -->
<div id="loading">

    <div class="loadingBox">
        <div class="loadingTitle">Loading Nova</div>

        <div class="loadingText" id="loadingText">
            Checking for the latest version...
        </div>

        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

</div>


<!-- Real Nova -->
<iframe id="app"></iframe>


<!-- Error -->
<div id="error">

    <div class="errorBox">

        <div class="errorTop">

            <div class="errorIcon">!</div>

            <div>
                <div class="errorTitle">Nova did not load</div>
                <div class="errorStatus">
                    The page displayed here does not work.
                </div>
            </div>

        </div>

        <div class="errorMessage" id="errorMessage"></div>

        <div class="errorWarning">
            The Nova application was not successfully loaded.
            The page behind this message is only a loading placeholder
            and cannot be used as Nova.
        </div>

        <button class="retry" onclick="location.reload()">
            Retry
        </button>

    </div>

</div>


<script>

/* =========================
   CONFIG
========================= */

const OWNER = "aoliveros091-sys";
const REPO = "Nova";
const BRANCH = "main";
const FILE = "Index.html";


/* =========================
   ELEMENTS
========================= */

const fakeNova = document.getElementById("fakeNova");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const app = document.getElementById("app");

const error = document.getElementById("error");
const errorMessage = document.getElementById("errorMessage");


/* =========================
   ERROR HANDLER
========================= */

function showError(message) {

    loading.style.display = "none";
    fakeNova.style.display = "none";
    app.style.display = "none";

    errorMessage.textContent = message;

    error.style.display = "flex";
}


/* =========================
   LOAD
========================= */

async function loadNova() {

    try {

        /*
         * Ask GitHub which commit is currently at main.
         *
         * This is the important part.
         *
         * We don't load @main directly because jsDelivr can
         * cache that alias for a long time.
         */

        loadingText.textContent =
            "Checking the latest GitHub version...";

        const githubAPI =
            `https://api.github.com/repos/${OWNER}/${REPO}/commits/${BRANCH}`;

        const githubResponse = await fetch(
            githubAPI,
            {
                cache: "no-store",
                headers: {
                    "Accept": "application/vnd.github+json"
                }
            }
        );

        if (!githubResponse.ok) {

            throw new Error(
                `GitHub returned HTTP ${githubResponse.status} ${githubResponse.statusText}`
            );

        }


        const commitData = await githubResponse.json();

        if (!commitData.sha) {
            throw new Error("GitHub did not return a commit hash.");
        }


        const commit = commitData.sha;


        /*
         * Exact commit URL.
         *
         * This is NOT @main.
         *
         * Every new GitHub commit creates a new URL,
         * so jsDelivr does not have to replace an old
         * cached @main response.
         */

        const source =
            `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${commit}/${FILE}`;

        const base =
            `https://cdn.jsdelivr.net/gh/${OWNER}/${REPO}@${commit}/`;


        loadingText.textContent =
            "Loading the latest Nova version...";


        /* =========================
           FETCH HTML
        ========================= */

        const response = await fetch(
            source,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {

            throw new Error(
                `jsDelivr returned HTTP ${response.status} ${response.statusText}`
            );

        }


        let html = await response.text();


        if (!html.trim()) {
            throw new Error("jsDelivr returned an empty Nova page.");
        }


        /* =========================
           FIX RELATIVE URLS
        ========================= */

        if (/<head[^>]*>/i.test(html)) {

            html = html.replace(
                /<head([^>]*)>/i,
                `<head$1><base href="${base}">`
            );

        } else {

            html =
                `<base href="${base}">` +
                html;

        }


        /* =========================
           CREATE BLOB
        ========================= */

        const blob = new Blob(
            [html],
            {
                type: "text/html"
            }
        );

        const blobURL = URL.createObjectURL(blob);


        /* =========================
           LOAD APP
        ========================= */

        app.onload = function () {

            /*
             * The real Nova page loaded.
             * Remove the fake page and loading overlay.
             */

            app.style.opacity = "1";

            loading.style.opacity = "0";
            fakeNova.style.opacity = "0";

            setTimeout(() => {

                loading.style.display = "none";
                fakeNova.style.display = "none";

            }, 350);

        };


        app.onerror = function () {

            URL.revokeObjectURL(blobURL);

            showError(
                "Nova could not be displayed.\n\n" +
                "The HTML was downloaded, but the browser could not load it."
            );

        };


        app.src = blobURL;


    } catch (err) {

        showError(
            "Failed to load Nova\n\n" +
            err.message
        );

    }

}


/* =========================
   START
========================= */

loadNova();

</script>

</body>
</html>
